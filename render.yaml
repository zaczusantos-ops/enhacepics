services:
  - type: web
    name: churchphoto-pro-api
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-pro"
      - key: PYTHON_VERSION
        value: "3.11.9"
